name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-dev.txt
      - run: pip install -r requirements-api.txt -r requirements-dev.txt
      - run: python -m pytest

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vibechecker-api .
      - run: docker run -d -p 8000:8000 vibechecker-api
      - run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker ps -a
          exit 1
      - run: |
          curl -sf -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d '{"comments": ["great video", "awful video"]}'

  extension:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -c "import json; json.load(open('extension/manifest.json'))"
      - run: zip -r vibechecker-extension.zip extension
      - uses: actions/upload-artifact@v4
        with:
          name: vibechecker-extension
          path: vibechecker-extension.zip